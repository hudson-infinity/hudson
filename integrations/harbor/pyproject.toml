[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hudson-harbor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["harbor @ git+https://github.com/harbor-framework/harbor.git@15da91c18580a25489f5bdf2ee71029f3ff3bb2e", "aiohttp>=3.12,<4"]

[tool.setuptools.packages.find]
include = ["hudson_harbor*"]
